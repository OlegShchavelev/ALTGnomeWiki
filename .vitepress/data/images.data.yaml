- name: 'ALT Regular Gnome'
  branch: sisyphus
  description: Регулярно обновляемый образ, основанный на нестабильной ветке sisyphus (current — еженедельная сборка, tested — вручную проверяемая сборка). Содержит минимальный программный набор
  actions:
    - text: Примечания к выпуску
      link: /images/alt-regular-gnome
    - text: Инструкция по установке
      link: /instalations/ordinary-install
    - text: Пользовательское соглашение
      link: https://nightly.altlinux.org/sisyphus/license.all.html
  downloads:
    - arch: x86_64
      branches:
        - name: tested
          recommended: true
          images:
            - urls:
                - https://nightly.altlinux.org/sisyphus/tested/regular-gnome-latest-x86_64.iso
                - https://mirror.yandex.ru/altlinux-nightly/tested/regular-gnome-latest-x86_64.iso

        - name: current
          images:
            - urls:
                - https://nightly.altlinux.org/sisyphus/current/regular-gnome-latest-x86_64.iso
                - https://mirror.yandex.ru/altlinux-nightly/current/regular-gnome-latest-x86_64.iso

    - arch: aarch64
      branches:
        - name: tested
          recommended: true
          images:
            - urls:
                - https://nightly.altlinux.org/sisyphus-aarch64/tested/regular-gnome-latest-aarch64.iso

        - name: current
          images:
            - urls:
                - https://nightly.altlinux.org/sisyphus-aarch64/current/regular-gnome-latest-aarch64.iso

- name: 'ALT Workstation'
  branch: p11
  description: Дистрибутив семейства ОС «Альт», разрабатываемый и поддерживаемый Базальт СПО. Основан на стабильной ветке p11, содержит большое количество программ и при установке позволяет выбрать список устанавливаемого ПО
  actions:
    - text: Примечания к выпуску
      link: /images/alt-workstation
    - text: Инструкция по установке
      link: /instalations/ordinary-install
    - text: Пользовательское соглашение
      link: https://nightly.altlinux.org/p11/license.all.html
  downloads:
    - arch: x86_64
      branches:
        - name: release
          images:
            - urls:
                - https://download.basealt.ru/pub/distributions/ALTLinux/p11/images/workstation/x86_64/alt-workstation-11.1-x86_64.iso
              badges:
                - type: tip
                  text: x86_64

    - arch: aarch64
      branches:
        - name: release
          images:
            - urls:
                - https://download.basealt.ru/pub/distributions/ALTLinux/p11/images/workstation/aarch64/alt-workstation-11.1-aarch64.iso
              badges:
                - type: tip
                  text: aarch64

